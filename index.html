<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sebastián Droguett - Portafolio</title>
  <!-- Fuerza que todos los enlaces de la página abran en pestaña nueva -->
  <base target="_blank">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #0d0d0d; display: flex; flex-direction: column; align-items: center; padding: 20px 0; }
    .page-container { position: relative; width: 90%; max-width: 1200px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    img { width: 100%; height: auto; display: block; border-radius: 8px; }
    
    /* Esta clase define dónde y cómo se posiciona el enlace interactivo */
    .link-overlay {
      position: absolute;
      /* AJUSTA ESTOS VALORES según dónde esté el enlace en la imagen pagina1.jpg */
      top: 45%; /* Posición vertical desde arriba */
      left: 15%; /* Posición horizontal desde la izquierda */
      width: 70%; /* Ancho del área del enlace */
      height: 10%; /* Alto del área del enlace */
      background-color: rgba(255, 255, 255, 0); /* Invisible por defecto */
      display: block;
      cursor: pointer;
      border-radius: 4px;
      transition: background-color 0.3s;
    }
    .link-overlay:hover {
      background-color: rgba(255, 255, 255, 0.1); /* Efecto hover opcional */
    }
  </style>
</head>
<body>

  <!-- PÁGINA 1 -->
  <div class="page-container">
    <img src="pagina1.jpg" alt="Portafolio Pagina 1">
    <!-- Este es el enlace sobre la imagen 1. Ajusta href y la clase .link-overlay en CSS -->
    <a href="https://drive.google.com/file/d/1xPZq2QYpFazqiV5f6NQo0B9Wgh8NcYvQ/preview" class="link-overlay" title="Explorar el sistema completo"></a>
  </div>

  <!-- PÁGINA 2 -->
  <div class="page-container">
    <img src="pagina2.jpg" alt="Portafolio Pagina 2">
  </div>

  <!-- PÁGINA 3 -->
  <div class="page-container">
    <img src="pagina3.jpg" alt="Portafolio Pagina 3">
  </div>

  <!-- PÁGINA 4 (Sigue este patrón para todas las páginas) -->
  <!--
  <div class="page-container">
    <img src="pagina4.jpg" alt="Portafolio Pagina 4">
  </div>
  -->

</body>
</html>
