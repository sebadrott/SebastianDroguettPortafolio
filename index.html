    img {

      height: auto;

    /* Capa flotante interactiva para los enlaces */

      position: absolute;
      background-color: rgba(255, 255, 255, 0); 
      display: block;
      cursor: pointer;
      border-radius: 4px;
      transition: background-color 0.3s;

    .link-overlay:hover {
